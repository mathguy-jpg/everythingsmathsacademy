
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png.png">
    <title>Physical Sciences Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="menu">
        <a href="index.html">Home</a>
        <a href="lessons.html">Our Lessons</a>
        <a href="index.html#why-choose-us">Why Choose Us</a>
        <a href="index.html#about-us">About Us</a>
    </div>
</nav>

<section class="trial-page">

    <h1>Physical Sciences Registration</h1>

    <div class="trial-box">

        <h2>Package</h2>

        <input
            type="text"
            value="Physical Sciences - R249.99 Per Month"
            readonly>

        <h2>Learner Name</h2>
        <input
            type="text"
            id="learnerName"
            placeholder="Enter Learner Name"
            required>

        <h2>Parent / Guardian Name</h2>
        <input
            type="text"
            id="parentName"
            placeholder="Enter Parent Name"
            required>

        <h2>Parent Contact Number</h2>
        <input
            type="tel"
            id="parentNumber"
            placeholder="Enter Parent Contact Number"
            required>

        <h2>Email Address</h2>
        <input
            type="email"
            id="email"
            placeholder="Enter Email Address"
            required>

        <h2>Grade</h2>

        <select id="grade" required>
            <option value="">Select Grade</option>
            <option value="Grade 10">Grade 10</option>
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12">Grade 12</option>
        </select>

        <button type="button" onclick="continueRegistration()">
            Continue To Payment
        </button>

    </div>

</section>

<script>

function continueRegistration() {

    const learner =
        document.getElementById("learnerName").value.trim();

    const parent =
        document.getElementById("parentName").value.trim();

    const parentNumber =
        document.getElementById("parentNumber").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const grade =
        document.getElementById("grade").value;

    if (!learner) {
        alert("Please enter learner name.");
        return;
    }

    if (!parent) {
        alert("Please enter parent name.");
        return;
    }

    if (!parentNumber) {
        alert("Please enter parent contact number.");
        return;
    }

    if (!email) {
        alert("Please enter email address.");
        return;
    }

    if (!grade) {
        alert("Please select a grade.");
        return;
    }

    alert(
        "Registration Details Completed Successfully!\n\n" +
        "Next Step: PayFast Payment."
    );

    // Redirect to Physical Sciences payment
    window.location.href = "science-payment.html";

}

</script>

</body>
</html>
