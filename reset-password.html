
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Everything's Maths Academy</title>

  <meta name="description" content="Securely reset your Everything's Maths Academy learner account password.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #263238;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 10px;
      border: 1px solid #e5e9ef;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      margin: 0;
      color: #1565c0;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .brand p {
      margin: 7px 0 0;
      color: #64748b;
      font-size: 12px;
      letter-spacing: 1px;
    }

    h2 {
      text-align: center;
      font-size: 21px;
      margin-bottom: 10px;
      color: #263238;
    }

    .description {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dce5;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 19px;
      outline: none;
    }

    input:focus {
      border-color: #1565c0;
      box-shadow: 0 0 0 2px rgba(21, 101, 192, 0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      background: #1565c0;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #0d4f9e;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
    }

    .success {
      display: block;
      color: #176b39;
      background: #edf8f0;
      border: 1px solid #c7e8d0;
    }

    .error {
      display: block;
      color: #b42318;
      background: #fff1f0;
      border: 1px solid #f5c2c0;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
    }

    .footer a {
      color: #1565c0;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="brand">
      <h1>EVERYTHING'S MATHS</h1>
      <p>ACADEMY</p>
    </header>

    <section id="resetSection" class="hidden">

      <h2>Reset Your Password</h2>

      <p class="description">
        Create a new password for your EMA learner account.
        Please enter your new password below.
      </p>

      <form id="resetForm">

        <label for="newPassword">New Password</label>

        <input
          type="password"
          id="newPassword"
          placeholder="Enter new password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <label for="confirmPassword">Confirm New Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button type="submit" id="updateButton">
          UPDATE PASSWORD
        </button>

      </form>

    </section>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <div class="footer">
      <a href="login.html">Back to Login</a>
    </div>

  </main>

  <!-- Supabase configuration -->
  <script src="config.js"></script>

  <!-- Supabase JavaScript v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (() => {
      const message = document.getElementById('message');
      const resetSection = document.getElementById('resetSection');
      const resetForm = document.getElementById('resetForm');
      const updateButton = document.getElementById('updateButton');

      let supabaseClient;
      let recoveryReady = false;
      let passwordUpdated = false;

      function showMessage(text, type) {
        message.textContent = text;
        message.className = 'message ' + type;
      }

      function showResetForm() {
        resetSection.classList.remove('hidden');
        message.className = 'message';
        message.textContent = '';
      }

      function showError(text) {
        resetSection.classList.add('hidden');
        showMessage(text, 'error');
      }

      async function initialize() {
        try {
          const cfg = window.EMA_CONFIG || {};

          if (
            !cfg.SUPABASE_URL ||
            !cfg.SUPABASE_ANON_KEY ||
            !window.supabase
          ) {
            throw new Error(
              'The EMA Supabase configuration could not be loaded.'
            );
          }

          supabaseClient = window.supabase.createClient(
            cfg.SUPABASE_URL,
            cfg.SUPABASE_ANON_KEY
          );

          // Listen for a valid password recovery session.
          supabaseClient.auth.onAuthStateChange(
            (event, session) => {
              if (
                event === 'PASSWORD_RECOVERY' &&
                session
              ) {
                recoveryReady = true;
                showResetForm();
              }
            }
          );

          // Check whether the recovery link established a session.
          const {
            data,
            error
          } = await supabaseClient.auth.getSession();

          if (error) throw error;

          if (data.session) {
            recoveryReady = true;
            showResetForm();
          } else {
            showError(
              'This password reset link is invalid or has expired. ' +
              'Please return to the login page and request a new reset email.'
            );
          }

        } catch (error) {
          console.error('EMA password recovery:', error);

          showError(
            error.message ||
            'Unable to open the password reset page. Please try again.'
          );
        }
      }

      resetForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (!recoveryReady || passwordUpdated) {
          showError(
            'Your password reset session is no longer available. ' +
            'Please request a new reset email.'
          );
          return;
        }

        const newPassword =
          document.getElementById('newPassword').value;

        const confirmPassword =
          document.getElementById('confirmPassword').value;

        if (newPassword.length < 8) {
          showMessage(
            'Your password must contain at least 8 characters.',
            'error'
          );
          return;
        }

        if (newPassword !== confirmPassword) {
          showMessage(
            'The passwords do not match. Please try again.',
            'error'
          );
          return;
        }

        updateButton.disabled = true;
        updateButton.textContent = 'UPDATING...';

        try {
          const {
            data,
            error
          } = await supabaseClient.auth.updateUser({
            password: newPassword
          });

          if (error) throw error;

          if (!data.user) {
            throw new Error(
              'Password update could not be confirmed.'
            );
          }

          passwordUpdated = true;
          recoveryReady = false;

          resetForm.reset();
          resetSection.classList.add('hidden');

          showMessage(
            'Your password has been updated successfully. ' +
            'You can now return to the EMA login page and sign in ' +
            'using your existing learner number and new password.',
            'success'
          );

          updateButton.textContent = 'PASSWORD UPDATED';

        } catch (error) {
          console.error('EMA password update:', error);

          showMessage(
            error.message ||
            'Something went wrong. Please try again.',
            'error'
          );

          updateButton.disabled = false;
          updateButton.textContent = 'UPDATE PASSWORD';
        }
      });

      initialize();
    })();
  </script>

</body>
</html>
