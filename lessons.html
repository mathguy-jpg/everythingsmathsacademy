<style>
*,
*::before,
*::after {
    box-sizing: border-box;
}

:root {
    --navy: #001f66;
    --blue: #1565c0;
    --gold: #ffd700;
    --text: #263238;
}

html {
    min-height: 100%;
    width: 100%;
    -webkit-text-size-adjust: 100%;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 15% 15%, rgba(21,101,192,.10), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(255,215,0,.10), transparent 28%),
        linear-gradient(135deg, #edf4ff, #ffffff 55%, #f4f8ff);
    overflow-x: hidden;
}

/* NAVIGATION - Linear horizontal ribbon */
nav {
    width: 100%;
    min-height: 54px;
    padding: 10px 16px;
    background: var(--navy);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 3px 12px rgba(0,31,102,.12);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}

nav::-webkit-scrollbar {
    display: none;
}

nav .menu {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: nowrap;
    gap: 18px;
    white-space: nowrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: color .2s ease;
    padding: 4px 4px;
}

nav a:hover {
    color: var(--gold);
}

.login-btn {
    background: var(--blue);
    padding: 6px 12px;
    border-radius: 8px;
}

/* LESSONS PAGE & HORIZONTAL SCROLL GRID */
.lessons-page {
    width: 100%;
    min-height: calc(100vh - 54px);
    padding: 25px 0;
    text-align: center;
}

.lessons-page h1 {
    color: var(--navy);
    font-size: clamp(22px, 4.5vw, 36px);
    font-weight: 800;
    margin: 0 0 16px;
    letter-spacing: -.6px;
    padding: 0 16px;
}

.lessons-grid {
    display: flex;
    align-items: stretch; /* Forces equal height across cards */
    gap: 12px;
    overflow-x: auto; /* Allows smooth horizontal swiping to see more cards */
    scroll-behavior: smooth;
    padding: 10px 16px 25px;
    justify-content: flex-start;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
}

/* LESSON CARD - Sized so at least two cards fit visible on screen */
.lesson-card {
    background: rgba(255,255,255,.97);
    border: 1px solid #e0e9f7;
    border-radius: 16px;
    padding: 20px 14px;
    box-shadow: 0 8px 25px rgba(0,31,102,.1);
    min-width: 160px;
    max-width: 170px;
    flex: 0 0 160px;

    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: transform .2s, box-shadow .2s;
}

.lesson-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0,31,102,.14);
}

.lesson-icon {
    width: 46px;
    height: 46px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: var(--blue);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
}

.lesson-card h2 {
    color: var(--navy);
    font-size: 14px;
    font-weight: 800;
    margin: 0 0 6px;
    line-height: 1.3;
}

.lesson-card h3 {
    font-size: 22px;
    color: var(--blue);
    font-weight: 800;
    margin: 0 0 6px;
}

.lesson-card p {
    color: #64748b;
    font-size: 11px;
    line-height: 1.35;
    margin: 0 0 14px;
}

/* Pushes the button wrapper to the bottom baseline */
.lesson-card a {
    margin-top: auto; 
    width: 100%;
    display: block;
    text-decoration: none;
}

.lesson-card button {
    background: var(--blue);
    color: white;
    border: none;
    width: 100%;
    min-height: 38px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: background .2s, transform .2s;
    -webkit-tap-highlight-color: transparent;
}

.lesson-card button:hover {
    background: var(--navy);
}

.lesson-card button:active {
    transform: scale(.99);
}

/* TABLET & DESKTOP MEDIA QUERY (Larger cards on big screens) */
@media (min-width: 768px) {
    nav {
        justify-content: center;
        overflow-x: visible;
    }
    nav .menu {
        gap: 26px;
    }
    nav a {
        font-size: 14px;
    }
    .lessons-grid {
        justify-content: center;
        gap: 24px;
        padding: 10px 20px 30px;
    }
    .lesson-card {
        min-width: 270px;
        max-width: 270px;
        flex: 0 0 270px;
        padding: 30px 22px;
    }
    .lesson-icon {
        width: 64px;
        height: 64px;
        font-size: 26px;
    }
    .lesson-card h2 {
        font-size: 18px;
    }
    .lesson-card h3 {
        font-size: 30px;
    }
    .lesson-card p {
        font-size: 13px;
    }
    .lesson-card button {
        min-height: 46px;
        padding: 12px 16px;
        font-size: 15px;
        border-radius: 10px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        transition-duration: .01ms !important;
    }
}
</style>
</head>
